<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>부산 수퍼마켓 지도 | 매장 위치 한눈에 보기</title>
  <meta name="description" content="부산광역시 수퍼마켓 매장 위치를 지도에서 검색하고 구·군, 브랜드별로 살펴보는 무료 지도 페이지입니다.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="panel" id="panel" aria-label="매장 검색 및 목록">
      <header class="panel__header">
        <h1 class="title"><span class="title__mark" aria-hidden="true">🛒</span> 부산 수퍼마켓 지도</h1>
        <p class="subtitle">매장 위치 검색 · 구/군 · 브랜드 필터</p>
      </header>

      <div class="controls">
        <label class="field field--search" for="searchInput">
          <span class="visually-hidden">상호명 또는 주소 검색</span>
          <input id="searchInput" type="search" placeholder="상호명 · 주소 검색" autocomplete="off">
        </label>
        <div class="field-row">
          <label class="field" for="guSelect">
            <span class="field__label">구/군</span>
            <select id="guSelect"><option value="">전체</option></select>
          </label>
          <button id="resetBtn" class="btn btn--ghost" type="button">초기화</button>
        </div>
        <div class="field">
          <span class="field__label" id="brandLabel">브랜드</span>
          <div class="chips" id="brandChips" role="group" aria-labelledby="brandLabel"></div>
        </div>
      </div>

      <div class="result-bar">
        <strong id="resultCount">0</strong>개 매장
        <span class="result-bar__note" id="skipNote"></span>
      </div>

      <ul class="list" id="storeList" aria-live="polite"></ul>

      <footer class="panel__footer">
        데이터: 소상공인시장진흥공단 상가(상권)정보 (부산, 2026.06)<br>
        지도: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors · <a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>
      </footer>
    </aside>

    <main class="map-wrap">
      <div id="map" role="application" aria-label="수퍼마켓 위치 지도"></div>
      <button id="sheetToggle" class="sheet-toggle" type="button" aria-controls="panel" aria-expanded="true">목록 보기</button>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
